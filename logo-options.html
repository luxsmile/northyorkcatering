<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North York Catering | Logo Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FDFBF7; color: #2B2825; font-family: Montserrat, sans-serif; padding: 40px 20px; }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; text-align: center; font-size: 34px; margin: 0 0 6px; }
    p.sub { text-align: center; color: #6F675E; margin: 0 0 40px; font-size: 14px; }
    .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .card { border: 1px solid #E9DFCF; background: #fff; padding: 36px 20px 24px; text-align: center; }
    .card.dark { background: #2B2825; border-color: #2B2825; }
    .card h2 { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #A8854A; margin: 24px 0 0; font-weight: 500; }
    svg { max-width: 100%; height: auto; }
    .serif { font-family: "Cormorant Garamond", serif; }
    .sans { font-family: Montserrat, sans-serif; }
  </style>
</head>
<body>
  <h1>Logo options</h1>
  <p class="sub">Three ideas for North York Catering. Each is shown on light and dark backgrounds.</p>

  <div class="grid">

    <!-- Option 1: Monogram -->
    <div class="card">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="NY monogram logo">
        <circle cx="150" cy="95" r="64" fill="none" stroke="#A8854A" stroke-width="1.5"/>
        <circle cx="150" cy="95" r="58" fill="none" stroke="#A8854A" stroke-width=".6"/>
        <text x="150" y="112" text-anchor="middle" class="serif" font-size="58" font-weight="500" fill="#2B2825" letter-spacing="2">NY</text>
        <text x="150" y="203" text-anchor="middle" class="serif" font-size="25" fill="#2B2825" letter-spacing="7">NORTH YORK</text>
        <line x1="85" y1="216" x2="215" y2="216" stroke="#A8854A" stroke-width=".8"/>
        <text x="150" y="238" text-anchor="middle" class="sans" font-size="10" fill="#A8854A" letter-spacing="7">CATERING</text>
      </svg>
      <h2>Option 1 · Monogram</h2>
    </div>
    <div class="card dark">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="NY monogram logo, light version">
        <circle cx="150" cy="95" r="64" fill="none" stroke="#D9C08E" stroke-width="1.5"/>
        <circle cx="150" cy="95" r="58" fill="none" stroke="#D9C08E" stroke-width=".6"/>
        <text x="150" y="112" text-anchor="middle" class="serif" font-size="58" font-weight="500" fill="#FDFBF7" letter-spacing="2">NY</text>
        <text x="150" y="203" text-anchor="middle" class="serif" font-size="25" fill="#FDFBF7" letter-spacing="7">NORTH YORK</text>
        <line x1="85" y1="216" x2="215" y2="216" stroke="#D9C08E" stroke-width=".8"/>
        <text x="150" y="238" text-anchor="middle" class="sans" font-size="10" fill="#D9C08E" letter-spacing="7">CATERING</text>
      </svg>
      <h2 style="color:#D9C08E">Option 1 · On dark</h2>
    </div>

    <!-- Option 2: Arch + cloche -->
    <div class="card">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="Arch with serving dome logo">
        <path d="M105 150 V80 a45 45 0 0 1 90 0 V150 Z" fill="none" stroke="#A8854A" stroke-width="1.5"/>
        <!-- serving dome (cloche) -->
        <path d="M122 128 a28 28 0 0 1 56 0 Z" fill="none" stroke="#2B2825" stroke-width="1.6"/>
        <circle cx="150" cy="96" r="3" fill="#2B2825"/>
        <line x1="116" y1="128" x2="184" y2="128" stroke="#2B2825" stroke-width="1.6"/>
        <line x1="126" y1="135" x2="174" y2="135" stroke="#A8854A" stroke-width="1"/>
        <text x="150" y="198" text-anchor="middle" class="serif" font-size="27" fill="#2B2825" letter-spacing="6">NORTH YORK</text>
        <text x="150" y="224" text-anchor="middle" class="sans" font-size="10" fill="#A8854A" letter-spacing="7">FINE CATERING</text>
      </svg>
      <h2>Option 2 · Arch &amp; Dome</h2>
    </div>
    <div class="card dark">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="Arch with serving dome logo, light version">
        <path d="M105 150 V80 a45 45 0 0 1 90 0 V150 Z" fill="none" stroke="#D9C08E" stroke-width="1.5"/>
        <path d="M122 128 a28 28 0 0 1 56 0 Z" fill="none" stroke="#FDFBF7" stroke-width="1.6"/>
        <circle cx="150" cy="96" r="3" fill="#FDFBF7"/>
        <line x1="116" y1="128" x2="184" y2="128" stroke="#FDFBF7" stroke-width="1.6"/>
        <line x1="126" y1="135" x2="174" y2="135" stroke="#D9C08E" stroke-width="1"/>
        <text x="150" y="198" text-anchor="middle" class="serif" font-size="27" fill="#FDFBF7" letter-spacing="6">NORTH YORK</text>
        <text x="150" y="224" text-anchor="middle" class="sans" font-size="10" fill="#D9C08E" letter-spacing="7">FINE CATERING</text>
      </svg>
      <h2 style="color:#D9C08E">Option 2 · On dark</h2>
    </div>

    <!-- Option 3: Wordmark with star -->
    <div class="card">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="Wordmark logo with star">
        <!-- north star -->
        <path d="M150 52 L155 80 L183 85 L155 90 L150 118 L145 90 L117 85 L145 80 Z" fill="#A8854A"/>
        <text x="150" y="170" text-anchor="middle" class="serif" font-size="46" font-style="italic" fill="#2B2825">North York</text>
        <line x1="70" y1="190" x2="230" y2="190" stroke="#A8854A" stroke-width=".8"/>
        <text x="150" y="215" text-anchor="middle" class="sans" font-size="10" fill="#2B2825" letter-spacing="9">CATERING</text>
      </svg>
      <h2>Option 3 · North Star</h2>
    </div>
    <div class="card dark">
      <svg viewBox="0 0 300 260" width="300" role="img" aria-label="Wordmark logo with star, light version">
        <path d="M150 52 L155 80 L183 85 L155 90 L150 118 L145 90 L117 85 L145 80 Z" fill="#D9C08E"/>
        <text x="150" y="170" text-anchor="middle" class="serif" font-size="46" font-style="italic" fill="#FDFBF7">North York</text>
        <line x1="70" y1="190" x2="230" y2="190" stroke="#D9C08E" stroke-width=".8"/>
        <text x="150" y="215" text-anchor="middle" class="sans" font-size="10" fill="#FDFBF7" letter-spacing="9">CATERING</text>
      </svg>
      <h2 style="color:#D9C08E">Option 3 · On dark</h2>
    </div>

  </div>
</body>
</html>
